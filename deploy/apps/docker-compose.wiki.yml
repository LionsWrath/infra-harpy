version: "3.1"

services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    restart: unless-stopped
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${WIKI_DB_NAME}
      - DB_USER=${WIKI_DB_USER}
      - DB_PASS=${WIKI_DB_PASS}
      - WIKI_DISABLE_UPDATE_CHECK=true
    env_file:
      - ../envs/base.env
      - ../envs/wiki.env
    depends_on:
      - postgres

networks:
  default:
    name: lsio
    external: true
