version: "2.2"

services:

  nessie:
    image: "projectnessie/nessie:latest"
    container_name: "nessie"
    environment:
      - "TZ=${TZ}"
      - "QUARKUS_HTTP_PORT=19120"
      - "NESSIE_VERSION_STORE_TYPE=jdbc"
      - "QUARKUS_DATASOURCE_DB_KIND=postgresql"
      - "QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/nessie"
      - "QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER}"
      - "QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}"
      - "VIRTUAL_HOST=nessie.orochi.chst.dev"
      - "VIRTUAL_PORT=19120"
    volumes:
      - "${DATA_PATH}/nessie:/var/lib/nessie"
    restart: "unless-stopped"
    networks:
      default:
        ipv4_address: "${LSIO_IP}.87"
    env_file:
      - ../envs/base.env
      - ../envs/db_pg.env

  trino:
    image: "trinodb/trino:latest"
    container_name: "trino"
    depends_on:
      - "nessie"
    environment:
      - "TZ=${TZ}"
      - "VIRTUAL_HOST=trino.orochi.chst.dev"
      - "VIRTUAL_PORT=8080"
    volumes:
      - "${DATA_PATH}/trino/config.properties:/etc/trino/config.properties"
      - "${DATA_PATH}/trino/jvm.config:/etc/trino/jvm.config"
      - "${DATA_PATH}/trino/catalog:/etc/trino/catalog"
      - "${DATA_PATH}/trino/runtime:/data/trino"
      - "${DATA_PATH}/trino/tmp:/tmp"
      - "/home/lionswrath/data/lake:/data/lake"
    restart: "unless-stopped"
    networks:
      default:
        ipv4_address: "${LSIO_IP}.88"
    env_file:
      - ../envs/base.env

networks:
  default:
    name: lsio
    external: true
